[workspace]
members = ["crates/sevqo-engine", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
authors = ["Sevqo"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
notify = "8"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "stream"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
lopdf = "0.36"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
crossbeam-channel = "0.5"
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
dirs = "6"
urlencoding = "2"
encoding_rs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
base64 = "0.22"

sevqo-engine = { path = "crates/sevqo-engine" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
